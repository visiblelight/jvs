name: Test & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: jvs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Job 1：运行测试 ──────────────────────────────────────────────────────────
  test:
    name: Backend API Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jvs_test
          POSTGRES_PASSWORD: jvs_test
          POSTGRES_DB: jvs_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jvs_test -d jvs_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TEST_POSTGRES_URL: postgresql://jvs_test:jvs_test@127.0.0.1:5432/jvs_ci_test
      TEST_DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql://jvs_test:jvs_test@127.0.0.1:5432/jvs_ci_test' || 'sqlite:///:memory:' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: 安装依赖
        working-directory: backend
        run: pip install --require-hashes -r requirements-dev.txt

      - name: 运行测试
        working-directory: backend
        run: python -m pytest tests/ -v --tb=short

  frontend:
    name: Frontend tests and builds
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin, mobile]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Same-origin build
        run: npm run build
      - name: Separate-origin build
        env:
          VITE_API_BASE_URL: https://api.example.com
          VITE_BASE_PATH: /
        run: npm run build

  # ── Job 2：部署（仅 push 到 main，且测试通过后执行）────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [test, frontend]              # 所有后端、迁移与前端检查通过才部署
    if: github.event_name == 'push'      # PR 只跑测试，不部署

    steps:
      - name: 🚀 执行远程部署脚本
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            echo "1. 正在进入部署目录..."
            cd ${{ secrets.VPS_PROJECT_DIR }}

            echo "2. 正在拉取远端最新代码..."
            test -z "$(git status --porcelain --untracked-files=no)" || { echo 'Tracked files modified; refusing deployment'; exit 1; }
            git fetch origin main
            git merge-base --is-ancestor '${{ github.sha }}' origin/main
            git checkout --detach '${{ github.sha }}'

            echo "3. 开始运行一键构建重构..."
            bash ./build-1.sh

            echo "✅ 部署已成功执行完毕！"
