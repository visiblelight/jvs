services:

  # ── Shared infrastructure ──────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  certbot:
    profiles: [plan1, plan2]
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

  # ── Plan 1: nginx serves frontend static files + API proxy ────────────────

  nginx-plan1:
    profiles: [plan1]
    image: nginx:alpine
    restart: unless-stopped
    entrypoint: /reload-with-cert-watch.sh
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./nginx/plan1.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/reload-with-cert-watch.sh:/reload-with-cert-watch.sh:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
      - ./dist/admin:/usr/share/nginx/admin:ro
      - ./dist/mobile:/usr/share/nginx/mobile:ro
    depends_on:
      - backend

  # ── Plan 2: nginx API-only proxy + CORS for Vercel frontend ───────────────

  nginx-plan2:
    profiles: [plan2]
    image: nginx:alpine
    restart: unless-stopped
    entrypoint: /reload-with-cert-watch.sh
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - ./nginx/plan2.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/reload-with-cert-watch.sh:/reload-with-cert-watch.sh:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - backend

  # Shared Edge terminates TLS; only this Web service joins the proxy network.
  nginx-edge:
    profiles: [edge]
    image: nginx:alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./nginx/edge.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./dist/admin:/usr/share/nginx/admin:ro
      - ./dist/mobile:/usr/share/nginx/mobile:ro
    networks:
      default: {}
      edge:
        aliases: [jvs-web]
    depends_on: [backend]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/healthz]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  uploads:
  letsencrypt:
  certbot_webroot:

networks:
  edge:
    external: true
    name: ${JVS_EDGE_NETWORK:-jvs-edge}
